<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOMORA Worker</title>

<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f7f4ff,#eef5ff);
color:#171721
}
header{
padding:18px 6%;
display:flex;justify-content:space-between;align-items:center;
background:rgba(255,255,255,.8);
backdrop-filter:blur(12px)
}
.logo{font-size:28px;font-weight:900;color:#6d28d9}
.pill{padding:9px 14px;border-radius:30px;background:#ede9fe;color:#6d28d9;font-weight:bold}
main{max-width:850px;margin:auto;padding:22px 18px}
.hero{
padding:32px 24px;border-radius:26px;
background:linear-gradient(135deg,#7c3aed,#4f46e5);
color:white;margin-bottom:20px;
box-shadow:0 15px 35px #6d28d933
}
.hero h1{font-size:32px;margin:0 0 10px}
.hero p{font-size:16px;line-height:1.5;margin:0}
.auth,.card{
background:rgba(255,255,255,.82);
backdrop-filter:blur(15px);
border:1px solid white;
padding:22px;border-radius:22px;
box-shadow:0 8px 25px #00000010
}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{
flex:1;padding:12px;border:0;border-radius:12px;
background:#eee9ff;color:#6d28d9;font-weight:bold
}
.tabs button.active{background:#6d28d9;color:white}
input{
width:100%;padding:14px;margin:7px 0 12px;
border:1px solid #ddd;border-radius:12px;font-size:15px
}
button{cursor:pointer;border:0;border-radius:12px;padding:13px;font-weight:bold}
.primary{width:100%;background:#6d28d9;color:white}
.forgot{width:100%;margin-top:8px;background:transparent;color:#6d28d9}
.hidden{display:none}
.dashboard{display:grid;gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:17px;border-radius:17px;background:#f4f1ff}
.stat b{display:block;font-size:24px;margin-top:5px}
.booking{border:1px solid #e5e7eb;border-radius:17px;padding:17px;margin-top:12px;background:white}
.actions{display:flex;gap:8px;margin-top:12px}
.accept{background:#16a34a;color:white;flex:1}
.reject{background:#fee2e2;color:#dc2626;flex:1}
.logout{background:#111827;color:white}
.message{font-weight:bold}
.notification{
position:fixed;top:20px;left:50%;transform:translateX(-50%);
background:#16a34a;color:white;padding:14px 20px;
border-radius:14px;box-shadow:0 8px 25px #0003;
z-index:999;font-weight:bold
}
@media(max-width:600px){
.stats{grid-template-columns:1fr}
.hero h1{font-size:27px}
}
</style>
</head>

<body>

<header>
<div class="logo">HOMORA</div>
<div class="pill">WORKER APP</div>
</header>

<main>

<div id="authScreen">

<div class="hero">
<h1>Start Today. Build Your Future.</h1>
<p>Join HOMORA, grow your skills, earn with every service and settle into success.</p>
</div>

<div class="auth">

<div class="tabs">
<button id="loginTab" class="active" onclick="showLogin()">Login</button>
<button id="signupTab" onclick="showSignup()">Create Account</button>
</div>

<div id="loginForm">
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button class="primary" onclick="login()">Login to HOMORA</button>
<button class="forgot" onclick="forgotPassword()">Forgot Password?</button>
</div>

<div id="signupForm" class="hidden">
<input id="signupName" placeholder="Full Name">
<input id="signupPhone" placeholder="Mobile Number">
<input id="signupEmail" type="email" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Create Password">
<button class="primary" onclick="registerWorker()">Start With HOMORA</button>
</div>

<p id="authMsg" class="message"></p>

</div>
</div>

<div id="dashboard" class="dashboard hidden">

<div class="hero">
<h1>Welcome, <span id="workerName">Worker</span> 👋</h1>
<p>Your HOMORA journey starts here. Stay active and grow your earnings.</p>
</div>

<div class="stats">
<div class="stat">Today<b>₹<span id="todayEarn">0</span></b></div>
<div class="stat">New Jobs<b id="jobCount">0</b></div>
<div class="stat">Rating<b>⭐ 5.0</b></div>
</div>

<div class="card">
<h2>🔔 New Bookings</h2>
<div id="bookings">Loading bookings...</div>
</div>

<div class="card">
<button class="logout" onclick="logout()">Logout</button>
</div>

</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
collection,
query,
where,
getDocs,
updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyAFnzY61X6YVWaKB03ig6_a-EUQ6qfFRec",
authDomain:"homora-41400.firebaseapp.com",
projectId:"homora-41400",
storageBucket:"homora-41400.firebasestorage.app",
messagingSenderId:"252376803932",
appId:"1:252376803932:web:595c23360a014a0cfc9499"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let previousBookingIds=new Set();
let firstBookingLoad=true;
let soundUnlocked=false;


function unlockSound(){

if(soundUnlocked)return;

try{
const AudioContext=window.AudioContext||window.webkitAudioContext;
if(AudioContext){
const ctx=new AudioContext();
ctx.resume();
}
soundUnlocked=true;
}catch(e){}

}


document.addEventListener("click",unlockSound,{once:true});


function playAlert(){

try{

const AudioContext=window.AudioContext||window.webkitAudioContext;

if(AudioContext){

const ctx=new AudioContext();
const osc=ctx.createOscillator();
const gain=ctx.createGain();

osc.frequency.value=880;
gain.gain.value=0.25;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();

setTimeout(()=>{
osc.frequency.value=660;
},180);

setTimeout(()=>{
osc.stop();
ctx.close();
},400);

}

}catch(e){}

if(navigator.vibrate){
navigator.vibrate([300,150,300]);
}

}


function showNotification(){

playAlert();

if("Notification" in window &&
Notification.permission==="granted"){

new Notification("HOMORA — New Booking 🔔",{
body:"A new customer booking has arrived."
});

}

const div=document.createElement("div");
div.className="notification";
div.innerText="🔔 New HOMORA booking received!";
document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},4000);

}


window.showLogin=function(){

document.getElementById("loginForm").classList.remove("hidden");
document.getElementById("signupForm").classList.add("hidden");
document.getElementById("loginTab").classList.add("active");
document.getElementById("signupTab").classList.remove("active");

};


window.showSignup=function(){

document.getElementById("signupForm").classList.remove("hidden");
document.getElementById("loginForm").classList.add("hidden");
document.getElementById("signupTab").classList.add("active");
document.getElementById("loginTab").classList.remove("active");

};


window.registerWorker=async function(){

const name=document.getElementById("signupName").value.trim();
const phone=document.getElementById("signupPhone").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;

if(!name||!phone||!email||!password){
document.getElementById("authMsg").innerText="Please fill all details.";
return;
}

try{

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(doc(db,"workers",result.user.uid),{
name:name,
phone:phone,
email:email,
role:"worker",
status:"pending",
createdAt:new Date().toISOString()
});

document.getElementById("authMsg").innerText=
"✅ Account created successfully!";

}catch(e){

document.getElementById("authMsg").innerText=
"❌ "+e.message;

}

};


window.login=async function(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email||!password){
document.getElementById("authMsg").innerText=
"Enter email and password.";
return;
}

try{

await signInWithEmailAndPassword(auth,email,password);

}catch(e){

document.getElementById("authMsg").innerText=
"❌ "+e.message;

}

};


window.forgotPassword=async function(){

const email=document.getElementById("loginEmail").value.trim();

if(!email){
document.getElementById("authMsg").innerText=
"Enter your email first.";
return;
}

try{

await sendPasswordResetEmail(auth,email);

document.getElementById("authMsg").innerText=
"✅ Password reset link sent to your email.";

}catch(e){

document.getElementById("authMsg").innerText=
"❌ "+e.message;

}

};


onAuthStateChanged(auth,async user=>{

if(!user)return;

try{

const snap=await getDoc(doc(db,"workers",user.uid));

if(!snap.exists()){

document.getElementById("authMsg").innerText=
"❌ Worker profile not found.";

await signOut(auth);
return;

}

document.getElementById("authScreen").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("workerName").innerText=
snap.data().name||"Worker";

if("Notification" in window &&
Notification.permission==="default"){

await Notification.requestPermission();

}

loadBookings();

}catch(e){

console.log(e);

}

});


async function loadBookings(){

try{

const q=query(
collection(db,"bookings"),
where("status","==","pending")
);

const snap=await getDocs(q);

let html="";
let count=0;
let currentIds=new Set();

snap.forEach(item=>{

count++;
currentIds.add(item.id);

const b=item.data();

html+=`

<div class="booking">

<h3>🏠 ${b.service||"Home Service"}</h3>

<p>⏱️ ${b.hours||"-"} Hours</p>

<p>📍 ${b.address||"-"}</p>

<p>🟡 Pending</p>

<div class="actions">

<button class="accept"
onclick="acceptBooking('${item.id}')">
✓ Accept
</button>

<button class="reject"
onclick="rejectBooking('${item.id}')">
✕ Reject
</button>

</div>

</div>

`;

});


if(!firstBookingLoad){

for(const id of currentIds){

if(!previousBookingIds.has(id)){
showNotification();
break;
}

}

}

previousBookingIds=currentIds;
firstBookingLoad=false;

document.getElementById("bookings").innerHTML=
html||"No new bookings right now.";

document.getElementById("jobCount").innerText=count;

}catch(e){

document.getElementById("bookings").innerText=
"❌ "+e.message;

}

}


setInterval(()=>{

if(auth.currentUser){
loadBookings();
}

},10000);


window.acceptBooking=async function(id){

try{

await updateDoc(
doc(db,"bookings",id),
{
status:"accepted",
workerId:auth.currentUser.uid
}
);

alert("Booking accepted ✅");
loadBookings();

}catch(e){

alert("❌ "+e.message);

}

};


window.rejectBooking=async function(id){

try{

await updateDoc(
doc(db,"bookings",id),
{
status:"rejected"
}
);

alert("Booking rejected");
loadBookings();

}catch(e){

alert("❌ "+e.message);

}

};


window.logout=function(){

signOut(auth);
location.reload();

};

</script>

</body>
</html>
