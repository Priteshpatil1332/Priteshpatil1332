<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOMORA Worker</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}
header{background:#111827;color:white;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:800}
main{max-width:600px;margin:25px auto;padding:20px}
.card{background:white;padding:25px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-bottom:20px}
input{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px;font-weight:bold}
.secondary{background:#7c3aed}
.hidden{display:none}
.status{padding:12px;border-radius:10px;background:#dcfce7;color:#166534;font-weight:bold;text-align:center}
.booking{border:1px solid #ddd;padding:15px;border-radius:12px;margin-top:12px}
</style>
</head>

<body>

<header>
<div class="logo">HOMORA 👷</div>
<div>Worker</div>
</header>

<main>

<!-- LOGIN / REGISTER -->
<div class="card" id="authBox">

<h2>👷 Worker Registration</h2>

<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Mobile Number">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="registerWorker()">Create Worker Account</button>

<p style="text-align:center">Already registered?</p>

<button class="secondary" onclick="loginWorker()">Login</button>

<p id="message"></p>

</div>

<!-- WORKER DASHBOARD -->
<div id="dashboard" class="hidden">

<div class="card">
<h2>Welcome, <span id="workerName"></span> 👋</h2>
<div class="status">🟢 Available for HOMORA bookings</div>
</div>

<div class="card">
<h3>📋 Your Bookings</h3>
<div id="bookings">No bookings yet.</div>
</div>

<div class="card">
<h3>💰 Earnings</h3>
<h1>₹<span id="earnings">0</span></h1>
</div>

<div class="card">
<button onclick="logout()">Logout</button>
</div>

</div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyAFnzY61X6YVWaKB03ig_a-EUQ6qfFRec",
authDomain:"homora-41400.firebaseapp.com",
projectId:"homora-41400",
storageBucket:"homora-41400.firebasestorage.app",
messagingSenderId:"252376803932",
appId:"1:252376803932:web:595c23360a014a0cfc9499"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.registerWorker = async function(){

const name=document.getElementById("name").value.trim();
const phone=document.getElementById("phone").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!name || !phone || !email || !password){
document.getElementById("message").innerText="Please fill all details.";
return;
}

if(password.length<6){
document.getElementById("message").innerText="Password must be at least 6 characters.";
return;
}

try{

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(doc(db,"workers",result.user.uid),{
name:name,
phone:phone,
email:email,
role:"worker",
status:"pending",
createdAt:new Date().toISOString()
});

document.getElementById("message").innerText=
"✅ Worker account created successfully!";

}catch(error){

document.getElementById("message").innerText=
"❌ "+error.message;

}

};

window.loginWorker = async function(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
document.getElementById("message").innerText=
"Enter email and password.";
return;
}

try{

await signInWithEmailAndPassword(auth,email,password);

}catch(error){

document.getElementById("message").innerText=
"❌ "+error.message;

}

};

onAuthStateChanged(auth,async(user)=>{

if(user){

const snap=await getDoc(doc(db,"workers",user.uid));

if(snap.exists()){

document.getElementById("authBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("workerName").innerText=
snap.data().name;

}

}

});

window.logout=function(){
signOut(auth);
location.reload();
};

</script>

</body>
</html>
