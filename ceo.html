<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOMORA CEO Dashboard</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#f7f4ff,#eef5ff);
color:#171721
}
header{
background:rgba(255,255,255,.85);
backdrop-filter:blur(14px);
padding:18px 6%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #fff;
position:sticky;
top:0;
z-index:10
}
.logo{font-size:28px;font-weight:900;color:#6d28d9}
.ceo{background:#ede9fe;color:#6d28d9;padding:9px 15px;border-radius:30px;font-weight:bold}
main{max-width:1200px;margin:auto;padding:25px 18px}
.hero{
background:linear-gradient(135deg,#7c3aed,#4f46e5);
color:white;padding:30px 25px;
border-radius:26px;
box-shadow:0 15px 35px #6d28d933;
margin-bottom:22px
}
.hero h1{margin:0 0 8px;font-size:32px}
.hero p{margin:0;opacity:.9}
.login{
max-width:480px;margin:60px auto;
background:rgba(255,255,255,.82);
padding:25px;border-radius:24px;
box-shadow:0 12px 35px #0001;
backdrop-filter:blur(15px)
}
input{
width:100%;padding:14px;margin:7px 0 13px;
border:1px solid #ddd;border-radius:12px;
font-size:15px
}
button{
border:0;border-radius:12px;
padding:12px 16px;
font-weight:bold;cursor:pointer
}
.primary{width:100%;background:#6d28d9;color:#fff}
.logout{background:#111827;color:#fff}
.hidden{display:none}
.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-bottom:20px
}
.stat{
background:rgba(255,255,255,.85);
padding:20px;
border-radius:20px;
box-shadow:0 8px 25px #0000000d
}
.stat span{display:block;color:#6b7280}
.stat b{font-size:28px;display:block;margin-top:7px}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}
.card{
background:rgba(255,255,255,.85);
padding:20px;
border-radius:20px;
box-shadow:0 8px 25px #0000000d
}
.item{
padding:14px;
border:1px solid #e5e7eb;
border-radius:14px;
margin:10px 0;
background:#fff
}
.green{color:#16a34a}
.orange{color:#ea580c}
.red{color:#dc2626}
@media(max-width:800px){
.stats{grid-template-columns:1fr 1fr}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">HOMORA 👑</div>
<div class="ceo">CEO DASHBOARD</div>
</header>

<main>

<div id="loginBox" class="login">

<h2>Welcome Back, CEO 👑</h2>
<p>Manage your HOMORA business from one place.</p>

<input id="email" type="email" placeholder="CEO Email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="login()">Enter Dashboard</button>

<p id="msg"></p>

</div>


<div id="dashboard" class="hidden">

<div class="hero">
<h1>Good Day, CEO 👑</h1>
<p>Start building. Keep growing. Make HOMORA bigger every day.</p>
</div>


<div class="stats">

<div class="stat">
<span>👤 Customers</span>
<b id="customers">0</b>
</div>

<div class="stat">
<span>👷 Workers</span>
<b id="workers">0</b>
</div>

<div class="stat">
<span>📋 Bookings</span>
<b id="bookings">0</b>
</div>

<div class="stat">
<span>💰 Revenue</span>
<b>₹<span id="revenue">0</span></b>
</div>

</div>


<div class="grid">

<div class="card">

<h2>📋 Recent Bookings</h2>

<div id="bookingList">
Loading...
</div>

</div>


<div class="card">

<h2>👷 Workers</h2>

<div id="workerList">
Loading...
</div>

</div>

</div>


<div class="card" style="margin-top:18px">

<h2>👤 Customers</h2>

<div id="customerList">
Loading...
</div>

</div>


<div class="card" style="margin-top:18px">

<button class="logout" onclick="logout()">Logout</button>

</div>

</div>

</main>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyAFnzY61X6YVWaKB03ig6_a-EUQ6qfFRec",
authDomain:"homora-41400.firebaseapp.com",
projectId:"homora-41400",
storageBucket:"homora-41400.firebasestorage.app",
messagingSenderId:"252376803932",
appId:"1:252376803932:web:595c23360a014a0cfc9499"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


window.login=async function(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(auth,email,password);

}catch(e){

document.getElementById("msg").innerText="❌ "+e.message;

}

};


onAuthStateChanged(auth,user=>{

if(user){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

loadDashboard();

}

});


async function loadDashboard(){

try{

const customerSnap=await getDocs(
collection(db,"customers")
);

const workerSnap=await getDocs(
collection(db,"workers")
);

const bookingSnap=await getDocs(
collection(db,"bookings")
);


document.getElementById("customers").innerText=
customerSnap.size;

document.getElementById("workers").innerText=
workerSnap.size;

document.getElementById("bookings").innerText=
bookingSnap.size;


let revenue=0;

bookingSnap.forEach(x=>{

const b=x.data();

if(b.status==="completed"){
revenue += Number(b.amount||0);
}

});

document.getElementById("revenue").innerText=
revenue.toLocaleString("en-IN");


let workers="";

workerSnap.forEach(x=>{

const w=x.data();

workers+=`
<div class="item">
<b>👷 ${w.name||"Worker"}</b>
<br>
${w.phone||""}
<br>
<span class="green">${w.status||"active"}</span>
</div>
`;

});

document.getElementById("workerList").innerHTML=
workers||"No workers yet.";


let customers="";

customerSnap.forEach(x=>{

const c=x.data();

customers+=`
<div class="item">
<b>👤 ${c.name||"Customer"}</b>
<br>
${c.phone||""}
</div>
`;

});

document.getElementById("customerList").innerHTML=
customers||"No customers yet.";


let bookings="";

bookingSnap.forEach(x=>{

const b=x.data();

bookings+=`
<div class="item">
<b>🏠 ${b.service||"Home Service"}</b>
<br>
📍 ${b.address||"-"}
<br>
Status:
<span class="${
b.status==="accepted"?"green":
b.status==="rejected"?"red":"orange"
}">
${b.status||"pending"}
</span>
</div>
`;

});

document.getElementById("bookingList").innerHTML=
bookings||"No bookings yet.";


}catch(e){

console.log(e);

}

}


window.logout=function(){

signOut(auth);
location.reload();

};

</script>

</body>
</html>
