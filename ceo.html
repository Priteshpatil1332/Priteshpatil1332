<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HOMORA CEO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:430px;margin:70px auto;padding:20px}
.box{background:#111;border:1px solid #333;border-radius:22px;padding:28px}
h1{margin-top:0}
input{width:100%;padding:14px;margin:8px 0 14px;background:#080808;color:#fff;border:1px solid #444;border-radius:10px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#fff;color:#000;font-weight:bold;margin-top:5px}
.msg{margin-top:15px;line-height:1.5}
.green{color:#22c55e}.red{color:#ef4444}
.hidden{display:none}
</style>
</head>

<body>

<div class="wrap" id="login">
<div class="box">

<h1>HOMORA 👑 CEO</h1>
<p>Secure CEO Login</p>

<div id="phoneBox">
<input id="phone" type="tel" inputmode="numeric"
placeholder="8446060669" maxlength="10">

<div id="recaptcha-container"></div>

<button id="sendBtn">SEND OTP</button>
</div>

<div id="otpBox" class="hidden">
<input id="otp" type="tel" inputmode="numeric"
placeholder="Enter 6-digit OTP" maxlength="6">

<button id="verifyBtn">VERIFY OTP</button>
</div>

<div id="msg" class="msg"></div>

</div>
</div>

<div id="dashboard" class="wrap hidden">
<div class="box">
<h1>HOMORA 👑</h1>
<h2>CEO Command Center</h2>
<p class="green">✅ CEO Login Successful</p>
<button id="logoutBtn">LOGOUT</button>
</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
RecaptchaVerifier,
signInWithPhoneNumber,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {
apiKey: "AIzaSyAFnzY61X6YVWaKB03ig6_a-EUQ6qfFRec",
authDomain: "homora-41400.firebaseapp.com",
projectId: "homora-41400",
storageBucket: "homora-41400.firebasestorage.app",
messagingSenderId: "252376803932",
appId: "1:252376803932:web:595c23360a014a0cfc9499"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);


/* ================= CEO NUMBER ================= */

const CEO_PHONE = "8446060669";
const CEO_PHONE_FULL = "+91" + CEO_PHONE;

let confirmationResult = null;
let recaptchaVerifier = null;


/* ================= MESSAGE ================= */

function message(text,type="red"){
const msg=document.getElementById("msg");
msg.className="msg "+type;
msg.innerText=text;
}


/* ================= RECAPTCHA ================= */

function setupRecaptcha(){

if(recaptchaVerifier)return;

recaptchaVerifier = new RecaptchaVerifier(
auth,
"recaptcha-container",
{
size:"normal",
callback:function(){
console.log("reCAPTCHA verified");
},
"expired-callback":function(){
recaptchaVerifier=null;
}
}
);

recaptchaVerifier.render();

}


/* ================= SEND OTP ================= */

document.getElementById("sendBtn").onclick = async function(){

let number=document.getElementById("phone").value.trim();

number=number.replace(/\D/g,"");

if(number.startsWith("91") && number.length===12){
number=number.substring(2);
}

if(number!==CEO_PHONE){

message("❌ This mobile number is not authorized for CEO access.");
return;

}

try{

setupRecaptcha();

message("Sending OTP...","green");

confirmationResult =
await signInWithPhoneNumber(
auth,
CEO_PHONE_FULL,
recaptchaVerifier
);

document.getElementById("phoneBox").classList.add("hidden");
document.getElementById("otpBox").classList.remove("hidden");

message("✅ OTP sent successfully.","green");

}catch(error){

console.error(error);

message("❌ Firebase: "+error.message);

}

};


/* ================= VERIFY OTP ================= */

document.getElementById("verifyBtn").onclick = async function(){

const otp=document.getElementById("otp").value.trim();

if(!confirmationResult){

message("❌ Please request OTP first.");
return;

}

if(!otp){

message("❌ Enter the OTP.");
return;

}

try{

const result =
await confirmationResult.confirm(otp);

const user=result.user;

if(
!user.phoneNumber ||
user.phoneNumber !== CEO_PHONE_FULL
){

await signOut(auth);

message("❌ Unauthorized CEO account.");
return;

}

message("✅ Login successful!","green");

setTimeout(function(){

document.getElementById("login")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

},500);

}catch(error){

console.error(error);

message("❌ Invalid OTP. Try again.");

}

};


/* ================= EXISTING LOGIN ================= */

onAuthStateChanged(auth,function(user){

if(!user)return;

if(user.phoneNumber !== CEO_PHONE_FULL){

signOut(auth);
return;

}

document.getElementById("login")
.classList.add("hidden");

document.getElementById("dashboard")
.classList.remove("hidden");

});


/* ================= LOGOUT ================= */

document.getElementById("logoutBtn").onclick=function(){

signOut(auth).then(function(){
location.reload();
});

};

</script>

</body>
</html>
